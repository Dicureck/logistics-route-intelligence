name: Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build synthetic demonstration
        run: python -m logistics_route_intelligence demo --out-dir build/ci-demo
      - name: Upload reproducible artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: build/ci-demo
